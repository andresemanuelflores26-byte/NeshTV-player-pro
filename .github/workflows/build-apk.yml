name: Compilar APK NeshTV

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Construir APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (Versión 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Configurar Java JDK (Versión 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: 5. Compilar proyecto web (Vite / React)
        run: npm run build

      - name: 6. Configurar Capacitor y Sincronizar Android
        run: |
          npx cap sync android

      - name: 7. Dar permisos de ejecución a Gradle y Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Subir el APK generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: nesh-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
